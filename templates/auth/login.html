{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="auth-card">
    <div class="auth-brand">
        <div class="auth-logo">⚖️</div>
        <h1 class="auth-title">LexGuard <span class="brand-accent">AI</span></h1>
        <p class="auth-subtitle">India's Legal Intelligence Platform</p>
    </div>

    <form method="POST" action="{{ url_for('auth.login') }}" class="auth-form">
        <h2 class="form-heading">Sign In</h2>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
        </div>

        <div class="form-check">
            <input type="checkbox" id="remember" name="remember">
            <label for="remember">Remember me</label>
        </div>

        <button type="submit" class="btn-primary btn-full" id="loginBtn">
            Sign In to LexGuard
        </button>
    </form>

    <p class="auth-link">Don't have an account? <a href="{{ url_for('auth.register') }}">Create one free</a></p>

    <div class="auth-disclaimer">
        🛡️ For educational & informational purposes only
    </div>
</div>
{% endblock %}
