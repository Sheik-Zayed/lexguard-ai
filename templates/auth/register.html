{% extends "base.html" %}
{% block title %}Register{% endblock %}

{% block content %}
<div class="auth-card auth-card-wide">
    <div class="auth-brand">
        <div class="auth-logo">⚖️</div>
        <h1 class="auth-title">LexGuard <span class="brand-accent">AI</span></h1>
        <p class="auth-subtitle">Create Your Legal Account</p>
    </div>

    <form method="POST" action="{{ url_for('auth.register') }}" class="auth-form">
        <h2 class="form-heading">Register</h2>

        <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" placeholder="Aarav Sharma" required autocomplete="name">
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">
        </div>

        <div class="form-group">
            <label for="password">Password <small>(min. 8 characters)</small></label>
            <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="new-password" minlength="8">
        </div>

        <div class="form-group">
            <label for="role">I am a...</label>
            <select id="role" name="role">
                <option value="citizen">Citizen</option>
                <option value="student">Law Student</option>
                <option value="lawyer">Lawyer</option>
            </select>
        </div>

        <button type="submit" class="btn-primary btn-full" id="registerBtn">
            Create Account
        </button>
    </form>

    <p class="auth-link">Already have an account? <a href="{{ url_for('auth.login') }}">Sign in</a></p>

    <div class="auth-disclaimer">
        🛡️ By registering, you agree this platform is for educational purposes only.
    </div>
</div>
{% endblock %}
